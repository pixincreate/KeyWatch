# KeyWatch self-scan configuration.
#
# The test suite embeds fake example credentials as fixtures (the well-known
# AWS documentation example keys, dummy tokens in generated hook scripts).
# Exclude them so scanning this repository — including the pre-commit hook's
# staged scan — reports only real findings.
# detectors.toml is excluded because the detector definitions themselves are
# secret-shaped strings (pattern regexes, allowlist examples).
exclude = ["tests/*", "detectors.toml"]
