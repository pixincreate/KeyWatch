# KeyWatch self-scan configuration.
#
# target/ is build output. detectors.toml is excluded because the detector
# definitions themselves are secret-shaped strings (pattern regexes,
# allowlist examples) and the file changes whenever a detector is added.
#
# Everything else — including the fake credentials used as test fixtures — is
# covered by .keywatch-baseline.json rather than path exclusions, so a newly
# introduced secret in those files is still reported.
exclude = ["target/**", "detectors.toml"]
