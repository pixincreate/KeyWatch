name: Release

on:
  push:
    tags: ["v*"]
    
permissions:
  contents: read

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version=${GITHUB_REF_NAME#v}
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          action_version=$(sed -n "/^  version:$/,/^  paths:$/ s/^    default: '\([^']*\)'/\1/p" action.yml)
          test "$tag_version" = "$cargo_version"
          test "$tag_version" = "$action_version"
          grep -Fq "## [$tag_version] -" CHANGELOG.md

      - name: Validate distribution automation
        run: python3 scripts/action_validation/validate.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --all-features --all-targets

      - name: Run tests (release)
        run: cargo test --release --all-features --all-targets

      - name: Run Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Check package
        run: cargo package --locked

  release:
    name: release-${{ matrix.platform.asset_name }}
    needs: preflight
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: linux
            arch: x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: darwin
            arch: x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: darwin
            arch: aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: windows
            arch: x86_64
    env:
      BINARY_NAME: keywatch-${{ matrix.platform.asset_name }}-${{ matrix.platform.arch }}${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Release Notes
        id: release-notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VER=${VERSION#v}
          NOTES=$(awk -v ver="$VER" '
            /^## \[/ { if (p) { exit }; if ($2 == "["ver"]") { p=1; next } }
            p { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::Release notes for $VERSION not found in CHANGELOG.md"
            exit 1
          fi
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Add aarch64 Apple target
        if: matrix.platform.target == 'aarch64-apple-darwin'
        run: rustup target add aarch64-apple-darwin

      # Build the specific package
      - name: Build Binary
        run: |
          cargo build --locked --release --target ${{ matrix.platform.target }}

      - name: Prepare Asset
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.platform.target }}/release/key-watch${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }} \
             release/${{ env.BINARY_NAME }}
          if [ "${{ matrix.platform.os }}" = "ubuntu-latest" ]; then
            cp detectors.toml release/detectors.toml
          fi

      # Windows: Generate checksum using cmd and Windows syntax.
      - name: Generate SHA-256 (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: cmd
        run: |
          cd release
          certutil -hashfile %BINARY_NAME% SHA256 | findstr /V "hash" > %BINARY_NAME%.sha256

      # Unix (macOS/Ubuntu): Generate checksum using bash.
      - name: Generate SHA-256 (Unix)
        if: matrix.platform.os != 'windows-latest'
        shell: bash
        run: |
          cd release
          shasum -a 256 "$BINARY_NAME" > "$BINARY_NAME".sha256
          if [ "${{ matrix.platform.os }}" = "ubuntu-latest" ]; then
            shasum -a 256 detectors.toml > detectors.toml.sha256
          fi

      # Create Release
      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: "KeyWatch ${{ github.ref_name }}"
          files: |
            release/${{ env.BINARY_NAME }}
            release/${{ env.BINARY_NAME }}.sha256
            ${{ matrix.platform.os == 'ubuntu-latest' && 'release/detectors.toml' || '' }}
            ${{ matrix.platform.os == 'ubuntu-latest' && 'release/detectors.toml.sha256' || '' }}
          body: ${{ steps.release-notes.outputs.NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
