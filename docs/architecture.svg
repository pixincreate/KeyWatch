<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- ===================== INPUT ===================== -->
  <rect x="40" y="40" width="520" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="72" font-size="16" font-weight="700" fill="#334155" letter-spacing="1.5">INPUT</text>
  <text x="60" y="92" font-size="12" fill="#94a3b8">scan arguments from the CLI</text>

  <rect x="60" y="108" width="150" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="130" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Files / dirs</text>
  <text x="135" y="148" font-size="11" fill="#64748b" text-anchor="middle">--paths ...</text>

  <rect x="225" y="108" width="150" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="130" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">stdin</text>
  <text x="300" y="148" font-size="11" fill="#64748b" text-anchor="middle">--stdin</text>

  <rect x="390" y="108" width="150" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="465" y="130" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">git history</text>
  <text x="465" y="148" font-size="11" fill="#64748b" text-anchor="middle">--git-history</text>

  <text x="60" y="195" font-size="12" fill="#475569">flags: --exclude, --baseline, --update-baseline, --format, --config, --exit-mode, --verbose</text>

  <!-- ===================== CONFIGURATION ===================== -->
  <rect x="600" y="40" width="420" height="200" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="620" y="72" font-size="16" font-weight="700" fill="#1d4ed8" letter-spacing="1.5">CONFIGURATION</text>
  <text x="620" y="92" font-size="12" fill="#64748b">merged, never replaced</text>

  <rect x="620" y="108" width="180" height="52" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="710" y="130" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">detectors.toml</text>
  <text x="710" y="148" font-size="11" fill="#64748b" text-anchor="middle">built-in rules, 827 lines</text>

  <rect x="820" y="108" width="180" height="52" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="910" y="130" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">.keywatch.toml</text>
  <text x="910" y="148" font-size="11" fill="#64748b" text-anchor="middle">rules, overrides, excludes</text>

  <text x="620" y="195" font-size="12" fill="#475569">loaded at start; custom rules appended to detectors, overrides applied by name,</text>
  <text x="620" y="213" font-size="12" fill="#475569">exclude patterns merged with CLI --exclude</text>

  <!-- ===================== DETECTION PIPELINE ===================== -->
  <rect x="40" y="280" width="1480" height="300" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="60" y="312" font-size="16" font-weight="700" fill="#7e22ce" letter-spacing="1.5">DETECTION PIPELINE</text>
  <text x="60" y="332" font-size="12" fill="#64748b">one pass over each file, parallelized with rayon across files</text>

  <!-- Stage 1: collect -->
  <rect x="60" y="360" width="210" height="120" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="90" cy="390" r="12" fill="#a855f7"/>
  <text x="90" y="395" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="165" y="396" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Collect files</text>
  <text x="165" y="420" font-size="11" fill="#64748b" text-anchor="middle">recursive dir walk</text>
  <text x="165" y="437" font-size="11" fill="#64748b" text-anchor="middle">skip .git, binary files</text>
  <text x="165" y="454" font-size="11" fill="#64748b" text-anchor="middle">dedupe overlapping roots</text>

  <!-- Stage 2: exclude -->
  <rect x="300" y="360" width="210" height="120" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="330" cy="390" r="12" fill="#a855f7"/>
  <text x="330" y="395" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="405" y="396" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Exclude filter</text>
  <text x="405" y="420" font-size="11" fill="#64748b" text-anchor="middle">glob patterns from</text>
  <text x="405" y="437" font-size="11" fill="#64748b" text-anchor="middle">CLI --exclude + config</text>
  <text x="405" y="454" font-size="11" fill="#64748b" text-anchor="middle">files never read</text>

  <!-- Stage 3: keyword -->
  <rect x="540" y="360" width="210" height="120" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="570" cy="390" r="12" fill="#a855f7"/>
  <text x="570" y="395" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="645" y="396" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Keyword pre-filter</text>
  <text x="645" y="420" font-size="11" fill="#64748b" text-anchor="middle">fast path: skip if file</text>
  <text x="645" y="437" font-size="11" fill="#64748b" text-anchor="middle">has no detector keyword</text>
  <text x="645" y="454" font-size="11" fill="#64748b" text-anchor="middle">avoids regex cost</text>

  <!-- Stage 4: regex -->
  <rect x="780" y="360" width="210" height="120" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="810" cy="390" r="12" fill="#a855f7"/>
  <text x="810" y="395" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="885" y="396" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Regex match</text>
  <text x="885" y="420" font-size="11" fill="#64748b" text-anchor="middle">line detectors (single-line)</text>
  <text x="885" y="437" font-size="11" fill="#64748b" text-anchor="middle">multiline detectors ((?s))</text>
  <text x="885" y="454" font-size="11" fill="#64748b" text-anchor="middle">chunked, 50-line overlap</text>

  <!-- Stage 5: entropy -->
  <rect x="1020" y="360" width="210" height="120" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="1050" cy="390" r="12" fill="#a855f7"/>
  <text x="1050" y="395" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1125" y="396" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Entropy gate</text>
  <text x="1125" y="420" font-size="11" fill="#64748b" text-anchor="middle">Shannon entropy of match</text>
  <text x="1125" y="437" font-size="11" fill="#64748b" text-anchor="middle">must pass detector threshold</text>
  <text x="1125" y="454" font-size="11" fill="#64748b" text-anchor="middle">filters readable words</text>

  <!-- Stage 6: allowlist/suppress -->
  <rect x="1260" y="360" width="240" height="120" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="1290" cy="390" r="12" fill="#a855f7"/>
  <text x="1290" y="395" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="1380" y="396" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Allowlist + suppress</text>
  <text x="1380" y="420" font-size="11" fill="#64748b" text-anchor="middle">detector allowlist regexes</text>
  <text x="1380" y="437" font-size="11" fill="#64748b" text-anchor="middle">inline "keywatch:ignore"</text>
  <text x="1380" y="454" font-size="11" fill="#64748b" text-anchor="middle">emit Finding</text>

  <!-- Stage arrows -->
  <line x1="270" y1="420" x2="298" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="420" x2="538" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="420" x2="778" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="420" x2="1018" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1230" y1="420" x2="1258" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== POST-PROCESSING ===================== -->
  <rect x="600" y="620" width="420" height="110" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="620" y="652" font-size="16" font-weight="700" fill="#15803d" letter-spacing="1.5">POST-PROCESSING</text>

  <rect x="620" y="668" width="380" height="52" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="810" y="686" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Baseline filter (--baseline)</text>
  <text x="810" y="704" font-size="11" fill="#64748b" text-anchor="middle">SHA-256 fingerprint match drops known findings</text>
  <text x="810" y="718" font-size="11" fill="#64748b" text-anchor="middle">--update-baseline records new ones</text>

  <!-- ===================== OUTPUT ===================== -->
  <rect x="1060" y="620" width="460" height="110" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1080" y="652" font-size="16" font-weight="700" fill="#c2410c" letter-spacing="1.5">OUTPUT</text>

  <rect x="1080" y="668" width="130" height="44" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1145" y="688" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">JSON</text>
  <text x="1145" y="704" font-size="11" fill="#64748b" text-anchor="middle">--format json</text>

  <rect x="1225" y="668" width="130" height="44" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1290" y="688" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">SARIF 2.1.0</text>
  <text x="1290" y="704" font-size="11" fill="#64748b" text-anchor="middle">--format sarif</text>

  <rect x="1370" y="668" width="130" height="44" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1435" y="688" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Summary</text>
  <text x="1435" y="704" font-size="11" fill="#64748b" text-anchor="middle">severity counts</text>

  <text x="1080" y="740" font-size="12" fill="#475569">written to stdout or --output file; exit code from --exit-mode (strict / critical / always)</text>

  <!-- ===================== CROSS-LAYER ARROWS ===================== -->
  <line x1="300" y1="240" x2="300" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="320" x2="300" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="308" y="310" font-size="11" fill="#64748b">paths / stdin / git log</text>

  <line x1="810" y1="240" x2="810" y2="278" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="810" y1="400" x2="540" y2="400" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-accent)" stroke-dasharray="4 3"/>
  <text x="600" y="392" font-size="11" fill="#2563eb">detectors + overrides</text>
  <line x1="810" y1="430" x2="540" y2="430" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-accent)" stroke-dasharray="4 3"/>
  <text x="600" y="448" font-size="11" fill="#2563eb">exclude patterns</text>

  <line x1="810" y1="580" x2="810" y2="618" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="607" font-size="11" fill="#64748b">Vec&lt;Finding&gt; + ScanMetadata</text>

  <line x1="1020" y1="675" x2="1058" y2="675" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1040" y="667" font-size="11" fill="#64748b">filtered findings</text>

  <!-- ===================== DATA MODEL ===================== -->
  <rect x="40" y="770" width="1480" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="798" font-size="16" font-weight="700" fill="#334155" letter-spacing="1.5">DATA MODEL</text>

  <rect x="60" y="812" width="200" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="832" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Detector</text>
  <text x="160" y="850" font-size="10" fill="#64748b" text-anchor="middle">name, regex, keywords, allowlist</text>

  <rect x="300" y="812" width="200" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="832" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Finding</text>
  <text x="400" y="850" font-size="10" fill="#64748b" text-anchor="middle">file, line, type, severity</text>

  <rect x="540" y="812" width="200" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="640" y="832" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Severity</text>
  <text x="640" y="850" font-size="10" fill="#64748b" text-anchor="middle">critical / high / medium / low</text>

  <rect x="780" y="812" width="200" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="880" y="832" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">KeywatchConfig</text>
  <text x="880" y="850" font-size="11" fill="#64748b" text-anchor="middle">rules, overrides, exclude</text>

  <rect x="1020" y="812" width="200" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1120" y="832" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Baseline</text>
  <text x="1120" y="850" font-size="11" fill="#64748b" text-anchor="middle">fingerprint entries, version</text>

  <rect x="1260" y="812" width="240" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1380" y="832" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">ScanMetadata</text>
  <text x="1380" y="850" font-size="11" fill="#64748b" text-anchor="middle">files scanned, lines, excluded</text>

  <line x1="260" y1="837" x2="298" y2="837" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="837" x2="538" y2="837" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="837" x2="778" y2="837" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="980" y1="837" x2="1018" y2="837" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1220" y1="837" x2="1258" y2="837" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
